# Configurações do Quarkus
quarkus.application.name=mct-back

# Database (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mct_db
quarkus.datasource.username=mct_user
quarkus.datasource.password=mct_pass
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT Auth
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.issuer=mct-issuer
smallrye.jwt.sign.key.issuer=mct-issuer

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true

# CORS (Habilitado para Angular por padrão no localhost:4200)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200

# JSON Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
