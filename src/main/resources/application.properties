# Configurações do Quarkus
quarkus.application.name=mct-back

# Database (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mct_db
quarkus.datasource.username=mct_user
quarkus.datasource.password=mct_pass
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresPhysicalNamingStrategy
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# JWT Auth
quarkus.smallrye-jwt.enabled=true
smallrye.jwt.sign.key.issuer=mct-issuer
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=mct-issuer

quarkus.log.category."io.smallrye.jwt".level=DEBUG
quarkus.log.category."io.smallrye.jwt.build".level=DEBUG
quarkus.log.category."org.jose4j".level=DEBUG

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true

# CORS (Habilitado para Angular por padrão no localhost:4200)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.access-log.enabled=true

# JSON Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
