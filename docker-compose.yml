services:
  db:
    image: postgres:16
    container_name: mct-db
    environment:
      POSTGRES_USER: mct_user
      POSTGRES_PASSWORD: mct_pass
      POSTGRES_DB: mct_db
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: mct-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/mct_db
      QUARKUS_DATASOURCE_USERNAME: mct_user
      QUARKUS_DATASOURCE_PASSWORD: mct_pass
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
